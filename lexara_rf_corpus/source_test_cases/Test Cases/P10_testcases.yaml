    - InferDateTimeField
    - Composite Intent
    notional-spec-out:
      version: 0.2.0
      fields:
      - caption: Name
        data: string
        type: discrete
        role: dimension
        encoding: x
      - caption: Total  enrollment
        data: number
        type: continuous
        role: measure
        aggregation: sum
        encoding: y
      - caption: Total  enrollment
        data: number
        type: continuous
        role: measure
        aggregation: sum
        encoding: text
      sort:
        field: Name
        by: Total  enrollment
        aggregation: sum
        direction: desc
      categoricalFilters:
      - type: categorical
        field: Control of institution
        values:
        - Public
      - type: categorical
        field: Name
        limit:
