- description: Conversation for P01 on sample-superstore-datasource.yaml
  requirement-id: P01-FINANCE
  test-number: 1
  utterances:
  - canonical: Draw a box plot of Profit by Category for orders in 2017; exclude Technology.
    labels:
    - Box Plot
    - InferDateTimeField
    - 'Context Handling: Reference Resolution'
    - Pragmatic Ambiguity
    - Syntactic Ambiguity
    - Composite Intent
    notional-spec-out:
      version: 0.2.0
      fields:
      - caption: Category
        data: string
        type: discrete
        role: dimension
        encoding: x
      - caption: Profit
        data: number
        type: continuous
        role: measure
        aggregation: sum
        encoding: y
      chart: boxplot
      categoricalFilters:
      - type: categorical
        field: Category
        values:
        - Technology
        exclude: true
      dateRangeFilters:
      - type: date-range
        field: Order Date
        start: '2017-01-01'
        end: '2018-01-01'
    expected-nl:
      rationale: Follows the requested operation and reflects filters/sorts.
      statements:
      - text: The visualization matches the requested breakdown/filters.
